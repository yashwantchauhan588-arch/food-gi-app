name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor & Build Android Project
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Food GI Scanner" "com.foodgi.scanner" --web-dir .
          npx cap add android
          npx cap sync android

      - name: Grant Camera Permissions
        run: |
          sed -i '/<\/manifest>/i <uses-permission android:name="android.permission.CAMERA" \/>\n<uses-permission android:name="android.permission.INTERNET" \/>' android/app/src/main/AndroidManifest.xml

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Food-GI-Scanner-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
